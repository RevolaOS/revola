id = "uishowcase"
name = "UI Showcase"
description = "Shows every kind of screen and row an extension can add."
version = "0.1.0"
author = "RevolaOS"
license = "GPL-3.0-only"
api = "1.26"
stability = "beta"

[[module]]
name = "main"
trigger = "always"

[[asset]]                 # the Settings pane icon: a menu bitmap, like the stock ones
name = "pane"
file = "assets/pane.png"
menu = true

[[asset]]                 # a colour bitmap the canvas draws
name = "disc"
file = "assets/disc.png"

[[asset]]                 # read with asset_load
name = "note"
file = "assets/note.txt"

[[asset]]                 # read in part with asset_read
name = "note-raw"
file = "assets/note.txt"
compress = false
