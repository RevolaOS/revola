name: sdk
on:
  push:
  pull_request:
jobs:
  api-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that sdk/ changes come with an API version bump
        run: python3 tools/sdklock.py check
      - name: Host tests
        run: cd tools && python3 -m unittest discover -s tests
